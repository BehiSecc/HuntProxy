name: Release binaries

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.88.0"
  CARGO_TERM_COLOR: always

jobs:
  dependency-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"

      - name: Audit Rust and browser worker dependencies
        env:
          HUNTPROXY_AUDIT_DIR: ${{ runner.temp }}/huntproxy-dependency-audit
        run: scripts/check-dependencies.sh

  test:
    name: Test release source
    needs: dependency-audit
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Validate release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${GITHUB_REF_NAME#v}" == "$package_version" ]]

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev pkg-config zstd

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_VERSION"

      - name: Run repository checks
        env:
          HUNTPROXY_DATA_DIR: ${{ runner.temp }}/huntproxy-release-default
        run: scripts/check.sh

  build:
    name: Build ${{ matrix.asset }}
    needs: [dependency-audit, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: huntproxy-linux-x86_64.tar.gz
            platform: linux
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: huntproxy-linux-aarch64.tar.gz
            platform: linux
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: huntproxy-mac-intel-chip.tar.gz
            platform: macos
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: huntproxy-mac-apple-chip.tar.gz
            platform: macos
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev pkg-config

      - name: Install pinned Chromium system dependencies
        if: matrix.platform == 'linux'
        run: npx --yes playwright@1.64.0 install-deps chromium

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install cmake llvm pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Rust target
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.target }}"

      - name: Build release binary
        run: cargo "+${RUST_VERSION}" build --release --locked --target "${{ matrix.target }}" --bin HuntProxy

      - name: Smoke-test binary
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="target/${{ matrix.target }}/release/HuntProxy"
          "$binary" --version
          if [[ "${{ matrix.platform }}" == linux ]]; then
            ldd "$binary"
          else
            dependencies="$(otool -L "$binary")"
            printf '%s\n' "$dependencies"
            if grep -q '/opt/homebrew\|/usr/local/Cellar\|/usr/local/opt' <<<"$dependencies"; then
              exit 1
            fi
          fi

      - name: Package release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          package_dir="${RUNNER_TEMP}/huntproxy-package"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/HuntProxy" "$package_dir/HuntProxy"
          cat LICENSE THIRD_PARTY_NOTICES.md RUST_THIRD_PARTY_NOTICES.txt > "$package_dir/LICENSE"
          [[ "$(wc -c < "$package_dir/LICENSE")" -le 1048576 ]]
          chmod 755 "$package_dir/HuntProxy"
          tar -czf "${{ matrix.asset }}" -C "$package_dir" HuntProxy LICENSE
          [[ "$(tar -tzf "${{ matrix.asset }}" | LC_ALL=C sort | tr '\n' ' ')" == "HuntProxy LICENSE " ]]

      - name: Smoke-test packaged release
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_dir="${RUNNER_TEMP}/huntproxy-smoke"
          data_dir="${RUNNER_TEMP}/huntproxy-data"
          mkdir -p "$smoke_dir"
          tar -xzf "${{ matrix.asset }}" -C "$smoke_dir"
          binary="$smoke_dir/HuntProxy"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$("$binary" --version)" == "HuntProxy $package_version" ]]

          prepare_output="$("$binary" --data-dir "$data_dir" prepare-update)"
          PREPARE_OUTPUT="$prepare_output" PACKAGE_VERSION="$package_version" python3 <<'PY'
          import json
          import os

          result = json.loads(os.environ["PREPARE_OUTPUT"])
          assert result["ok"] is True
          assert result["version"] == os.environ["PACKAGE_VERSION"]
          assert isinstance(result["schema"], int) and result["schema"] > 0
          PY

          "$binary" --data-dir "$data_dir" serve >"${RUNNER_TEMP}/huntproxy-serve.log" 2>&1 &
          daemon_pid=$!
          cleanup() {
            "$binary" --data-dir "$data_dir" stop >/dev/null 2>&1 || true
            kill "$daemon_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            status="$("$binary" --data-dir "$data_dir" status)"
            if grep -q '^daemon: running$' <<<"$status"; then
              break
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null; then
              cat "${RUNNER_TEMP}/huntproxy-serve.log" >&2
              exit 1
            fi
            sleep 1
          done
          grep -q '^daemon: running$' <<<"$("$binary" --data-dir "$data_dir" status)"
          api_address="$(python3 - "$data_dir/config.toml" <<'PY'
          import pathlib
          import re
          import sys

          config = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          address = re.search(r'^api_listen = "([^"]+)"$', config, re.MULTILINE)
          if address is None:
              raise RuntimeError("generated config is missing api_listen")
          print(address.group(1))
          PY
          )"
          curl --fail --silent --show-error "http://${api_address}/api/v1/extensions" \
            > "${RUNNER_TEMP}/extensions.json"
          python3 - "${RUNNER_TEMP}/extensions.json" <<'PY'
          import json
          import pathlib
          import sys

          response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "403-bypasser": "0.6.1",
              "auth-analyzer": "1.4.2",
              "cache-analyzer": "0.15.0",
              "csrf-analyzer": "1.5.2",
              "ip-rotate": "1.1.1",
              "jwt-analyzer": "1.3.4",
              "param-finder": "0.7.0",
              "racer": "0.6.4",
              "request-smuggler": "1.4.9",
              "upload-analyzer": "1.3.4",
          }
          actual = {plugin["id"]: plugin["version"] for plugin in response["plugins"]}
          assert actual == expected, (actual, expected)
          assert response["load_issues"] == [], response["load_issues"]
          PY
          "$binary" --data-dir "$data_dir" stop
          wait "$daemon_pid"
          trap - EXIT

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum huntproxy-*.tar.gz | sort > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace published assets" >&2
            exit 1
          fi
          created=0
          cleanup_draft() {
            if [[ "$created" == 1 ]]; then
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap cleanup_draft ERR
          created=1
          gh release create "$GITHUB_REF_NAME" dist/huntproxy-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "HuntProxy $GITHUB_REF_NAME"
          created=0
