[package]
name = "transport_spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Phase 0 semantic transport spike: wreq vs primp for HuntProxy/bb"

[[bin]]
name = "wreq_spike"
path = "src/bin/wreq_spike.rs"

[[bin]]
name = "primp_spike"
path = "src/bin/primp_spike.rs"
required-features = ["primp"]

[features]
default = ["wreq-backend"]
# Pinned permissive Wreq path (BoringSSL via btls)
wreq-backend = ["dep:wreq", "dep:wreq-util"]
# Stable MIT primp comparison (rustls-based)
primp = ["dep:primp"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
anyhow = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
time = "0.3"

# Semantic egress — exact-pinned permissive prerelease (Apache-2.0)
# Never enable cookies, decompression, or system-proxy features.
wreq = { version = "=6.0.0-rc.29", default-features = false, features = ["webpki-roots", "tokio-rt", "stream", "prefix-symbols"], optional = true }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation", "tokio-rt"], optional = true }

# MIT alternative (younger, rustls-based fingerprint client)
# Impersonate is on by default; spike always calls no_proxy() and does not enable system-proxy.
primp = { version = "=1.3.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
