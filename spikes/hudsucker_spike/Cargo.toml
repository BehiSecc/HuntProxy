[package]
name = "hudsucker_spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 0 Hudsucker streaming/correlation spike for HuntProxy/bb"

[[bin]]
name = "hudsucker_spike"
path = "src/main.rs"

[dependencies]
hudsucker = { version = "0.25", default-features = false, features = ["http2", "rcgen-ca", "rustls-client"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "webpki-tokio"] }
rustls-pemfile = "2"
pin-project-lite = "0.2"
serde_json = "1"
